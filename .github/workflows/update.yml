name: Update data and publish

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild everything from the seeds
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Rebuild data.json from the chain
        if: github.event_name != 'push'
        run: node snapshot.mjs ${{ (github.event.schedule == '17 */6 * * *' || inputs.full) && '--full' || '' }}
      - name: Commit data.json
        id: commit
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data.json $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
